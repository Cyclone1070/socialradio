name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Backend gate (format + lint + tsc + unit tests)
        run: |
          npm ci || npm ci  # retry once: install downloads (registry/CDN) can time out transiently
          npm run gate

      - name: reddit-fetcher unit tests
        working-directory: reddit-fetcher
        run: |
          npm ci || npm ci
          npx tsc --noEmit
          npx jest
