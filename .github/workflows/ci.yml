name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Backend gate (format + lint + tsc + unit tests)
        run: |
          npm ci || npm ci  # retry once: install downloads (registry/CDN) can time out transiently
          npm run gate

      - name: Tier 1 mock payloads typecheck (must match the fetcher's types)
        run: npx tsc --noEmit -p deployment/mocks/tsconfig.json

      - name: reddit-fetcher unit tests
        working-directory: reddit-fetcher
        run: |
          npm ci || npm ci
          npx tsc --noEmit
          npx jest

  # Tier 1 e2e: the whole suite against mocks. No provider keys, no reddit, and
  # the browserless image is never pulled. The one external call left is the free
  # TTS library, which is why it lives in this tier rather than the paid one.
  # Tier 2 (contract probes against a real provider) is deliberately absent: it
  # is the only tier that spends money and talks to the internet.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tier 1 environment (dummy values, no real credentials)
        run: |
          # Two traps, both learned the hard way:
          # 1. The admin address must not be user@socialradio.com - the suite signs
          #    in as that address with its own password (seed-base.sql), and since
          #    POST /auth/login answers 201 the mismatch surfaces as a 401.
          # 2. INTERNAL_SERVICE_SECRET must not appear here. The app reads it from
          #    the compose interpolation ${INTERNAL_SERVICE_SECRET:-secret}, which
          #    sees the shell and the compose project directory, not this file, so
          #    writing it here reaches only the suite container and makes it send a
          #    token the app rejects. Both sides default to 'secret' instead.
          cat > .env <<'EOF'
          ADMIN_EMAIL=admin@socialradio.com
          ADMIN_PASSWORD=AdminPass123!
          JWT_SECRET=ci-only-secret
          EOF

      - name: Tier 1 e2e suite (docker, mocks only)
        working-directory: deployment/tests
        run: sh run-docker-test.sh all
