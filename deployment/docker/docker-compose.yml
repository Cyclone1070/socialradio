services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socialradio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/socialradio
      BROWSERLESS_WS_URL: ws://browserless:3000/playwright
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: socialradio-media
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_PUBLIC_URL: http://localhost:9000/socialradio-media
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      browserless:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      - hf_cache:/home/node/.cache

  browserless:
    image: browserless/chrome:latest
    ports:
      - "4000:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
    restart: always

volumes:
  postgres_data:
  minio_data:
  hf_cache:
