services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socialradio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: runner
    command: ["npx", "mikro-orm", "migration:up"]
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/socialradio
    depends_on:
      db:
        condition: service_healthy

  # Reconciles the database to media-tools/library/manifest.json. One-off: it runs
  # after the migrations and before the app, writes the rows the manifest lists
  # and deletes rows it no longer lists, so running it twice changes nothing. The
  # manifest is mounted read-only, so the container reads the inventory rather
  # than carrying a copy of it. A real deploy adds `--prune` to sweep the
  # bucket as well; it is left off here because deleting audio is destructive.
  seed:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: builder
    command: ["npx", "ts-node", "media-tools/index.ts", "seed"]
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/socialradio
      STORAGE_ENDPOINT: http://seaweedfs:9000
      STORAGE_BUCKET: socialradio-media
      STORAGE_ACCESS_KEY: socialradio-local
      STORAGE_SECRET_KEY: socialradio-local-secret
    volumes:
      - ../../media-tools/library:/usr/src/app/media-tools/library:ro
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy

  # Local parity for what Terraform owns in a deployment: the second bucket the
  # library is promoted into. The app creates the bucket it serves from; nothing
  # else creates this one, and `media promote` deliberately does not.
  bucket-init:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: runner
    command:
      - "node"
      - "-e"
      - |
        const { S3Client, CreateBucketCommand } = require('@aws-sdk/client-s3');
        const s3 = new S3Client({
          endpoint: process.env.STORAGE_ENDPOINT,
          region: 'auto',
          credentials: {
            accessKeyId: process.env.STORAGE_ACCESS_KEY,
            secretAccessKey: process.env.STORAGE_SECRET_KEY,
          },
          forcePathStyle: true,
        });
        const buckets = (process.env.EXTRA_BUCKETS || '').split(',').filter(Boolean);
        Promise.all(
          buckets.map((Bucket) =>
            s3.send(new CreateBucketCommand({ Bucket })).catch((e) => {
              if (e.name !== 'BucketAlreadyOwnedByYou' && e.name !== 'BucketAlreadyExists') throw e;
            }),
          ),
        ).then(() => console.log('buckets ready:', buckets.join(', ')));
    environment:
      STORAGE_ENDPOINT: http://seaweedfs:9000
      STORAGE_ACCESS_KEY: socialradio-local
      STORAGE_SECRET_KEY: socialradio-local-secret
      EXTRA_BUCKETS: socialradio-staging
    depends_on:
      seaweedfs:
        condition: service_healthy

  # SeaweedFS replaced MinIO: the MinIO open-source project is archived (Docker
  # Hub repo deleted, binaries return 410 Gone). The S3 API still listens on
  # 9000 so the app config, the suites and STORAGE_PUBLIC_URL are unchanged.
  # seaweedfs-s3.json carries two things. The "app" identity holds the
  # credentials below - SeaweedFS has no env-var equivalent, so this file is the
  # only place to declare them. The "anonymous" identity grants Write only: it
  # exists for the e2e fixtures, which upload with an unsigned PUT. Anonymous
  # reads are deliberately NOT granted here, because the app installs its own
  # public GetObject policy at boot - granting Read as well would let a broken
  # policy go unnoticed.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    ports:
      - "9000:9000" # S3 API
      - "9001:9333" # cluster UI, replaces the MinIO console
    entrypoint: ["/bin/sh", "-c"]
    # -ip.bind=0.0.0.0 is required for the healthcheck: by default SeaweedFS
    # binds to the container's own IP, so localhost:9000 refuses connections
    # from inside the container. -volume.max=0 lets the volume server grow a
    # collection per bucket without a ceiling: a second bucket (what `media
    # promote` copies into) is a second collection, and the default ceiling
    # answers writes with "no free volumes left".
    command:
      - "weed server -s3 -dir=/data -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0 -volume.max=0"
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/status"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/socialradio
      REDDIT_FETCHER_URL: http://fetcher:3001
      VOICE_SERVICE_URL: http://voice-service:3002
      STORAGE_ENDPOINT: http://seaweedfs:9000
      STORAGE_BUCKET: socialradio-media
      STORAGE_ACCESS_KEY: socialradio-local
      STORAGE_SECRET_KEY: socialradio-local-secret
      STORAGE_PUBLIC_URL: http://localhost:9000/socialradio-media
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-secret}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      fetcher:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    volumes:
      - hf_cache:/home/node/.cache
    # JSON lines on stdout; docker json-file driver bounds the disk copy.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Dedicated Reddit scraping container: owns browserless config, per-subreddit
  # contexts, and the global 1–2s pacing queue. Single container by design —
  # it IS the pacing point (scale-out = more (browserless + fetcher) pairs).
  # The speech service: owns the TTS engine, voice casting, turn concatenation and
  # the measured length of the audio it produced. Swapping engines means replacing
  # this container, not touching the app.
  voice-service:
    build:
      context: ../../voice-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      LOG_LEVEL: info
  fetcher:
    build:
      context: ../../reddit-fetcher
      dockerfile: Dockerfile
    environment:
      BROWSERLESS_WS_URL: ws://browserless:3000/playwright
    depends_on:
      browserless:
        condition: service_started
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  browserless:
    image: browserless/chrome:latest
    ports:
      - "4000:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
    restart: always

volumes:
  postgres_data:
  seaweedfs_data:
  hf_cache:
