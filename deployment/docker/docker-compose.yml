services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socialradio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: runner
    command: ["npx", "mikro-orm", "migration:up"]
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/socialradio
    depends_on:
      db:
        condition: service_healthy

  # SeaweedFS replaced MinIO: the MinIO open-source project is archived (Docker
  # Hub repo deleted, binaries return 410 Gone). The S3 API still listens on
  # 9000 so the app config, the suites and STORAGE_PUBLIC_URL are unchanged.
  # The credentials in seaweedfs-s3.json must match STORAGE_ACCESS_KEY and
  # STORAGE_SECRET_KEY below. The "anonymous" identity grants Read and Write
  # without a signature, mirroring the public GetObject/PutObject bucket policy
  # the app installs at boot: media is served straight from STORAGE_PUBLIC_URL,
  # and the e2e fixtures upload with an unsigned PUT.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    ports:
      - "9000:9000" # S3 API
      - "9001:9333" # cluster UI, replaces the MinIO console
    entrypoint: ["/bin/sh", "-c"]
    # -ip.bind=0.0.0.0 is required for the healthcheck: by default SeaweedFS
    # binds to the container's own IP, so localhost:9000 refuses connections
    # from inside the container.
    command:
      - "weed server -s3 -dir=/data -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0"
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/status"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/socialradio
      REDDIT_FETCHER_URL: http://fetcher:3001
      STORAGE_ENDPOINT: http://seaweedfs:9000
      STORAGE_BUCKET: socialradio-media
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_PUBLIC_URL: http://localhost:9000/socialradio-media
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-secret}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      fetcher:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    volumes:
      - hf_cache:/home/node/.cache
    # JSON lines on stdout; docker json-file driver bounds the disk copy.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Dedicated Reddit scraping container: owns browserless config, per-subreddit
  # contexts, and the global 1–2s pacing queue. Single container by design —
  # it IS the pacing point (scale-out = more (browserless + fetcher) pairs).
  fetcher:
    build:
      context: ../../reddit-fetcher
      dockerfile: Dockerfile
    environment:
      BROWSERLESS_WS_URL: ws://browserless:3000/playwright
    depends_on:
      browserless:
        condition: service_started
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  browserless:
    image: browserless/chrome:latest
    ports:
      - "4000:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
    restart: always

volumes:
  postgres_data:
  seaweedfs_data:
  hf_cache:
