services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socialradio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/socialradio
      REDDIT_FETCHER_URL: http://fetcher:3001
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: socialradio-media
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_PUBLIC_URL: http://localhost:9000/socialradio-media
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-secret}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      fetcher:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      - hf_cache:/home/node/.cache
      - audio_storage:/app/storage
    # JSON lines on stdout; docker json-file driver bounds the disk copy.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Dedicated Reddit scraping container: owns browserless config, per-subreddit
  # contexts, and the global 1–2s pacing queue. Single container by design —
  # it IS the pacing point (scale-out = more (browserless + fetcher) pairs).
  fetcher:
    build:
      context: ../../reddit-fetcher
      dockerfile: Dockerfile
    environment:
      BROWSERLESS_WS_URL: ws://browserless:3000/playwright
    depends_on:
      browserless:
        condition: service_started
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  browserless:
    image: browserless/chrome:latest
    ports:
      - "4000:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
    restart: always

  icecast:
    image: infiniteproject/icecast:latest
    ports:
      - "8000:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: hackme
      ICECAST_ADMIN_PASSWORD: hackme
      ICECAST_PASSWORD: hackme
    restart: always

  liquidsoap:
    build:
      context: ../../liquidsoap
      dockerfile: Dockerfile
    environment:
      ICECAST_HOST: icecast
      ICECAST_PORT: 8000
      ICECAST_PASSWORD: hackme
      BACKEND_URL: http://app:3000
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-secret}
    volumes:
      - audio_storage:/app/storage
    depends_on:
      app:
        condition: service_healthy
      icecast:
        condition: service_started
    restart: always

volumes:
  postgres_data:
  minio_data:
  hf_cache:
  audio_storage:
