services:
  # All SQL runs from inside the suite via the single psql_run helper
  # (docker-test.sh) — the seed service below was removed when the suite
  # gained psql access (one pattern, not two).
  tests:
    build:
      context: ../tests
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh"]
    command: ["/scripts/docker-test.sh"]
    env_file: ../../.env
    environment:
      - TARGET_URL=http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../tests/docker-test.sh:/scripts/docker-test.sh
      - ../tests/seed-test-user.sql:/scripts/seed-test-user.sql
      - ../tests/dead-sub-fixture.sql:/scripts/dead-sub-fixture.sql
    networks:
      - external_test_net
      - default
    depends_on:
      app:
        condition: service_healthy

networks:
  external_test_net:
    driver: bridge