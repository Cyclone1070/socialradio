services:
  # Tier 1 scraping: the app talks to this mock instead of the real fetcher, so
  # nothing reaches reddit and no browser is needed.
  fetcher-mock:
    image: node:24-alpine
    command: ["node", "/mocks/fetcher-server.mts"]
    volumes:
      - ../mocks:/mocks:ro

  # Tier 1 voice: the app's own client, duration handling and storage write stay
  # real, but the audio is pregenerated by the real engine and served from here, so
  # no turn reaches the speech endpoint during a suite run.
  voice-mock:
    image: node:24-alpine
    command: ["node", "/mocks/voice-server.mts"]
    volumes:
      - ../mocks:/mocks:ro
      - ../../voice-service/fixtures:/fixtures:ro

  # The real browserless image is a large pull and Tier 1 never renders a page,
  # so it is stubbed out: the app's depends_on is satisfied without downloading it.
  browserless:
    image: node:24-alpine
    command: ["node", "-e", "setInterval(() => {}, 1 << 30)"]
  # Tier 1 mock for the script-generation provider. The app's LLM_* point here,
  # so the whole suite runs with no provider key and no internet for the LLM.
  # Everything above the wire stays real: LlmService, the AI SDK, the parsers.
  mocks:
    image: node:24-alpine
    command: ["node", "/mocks/llm-server.mts"]
    volumes:
      - ../mocks:/mocks:ro
    environment:
      - LLM_MODEL=mock-model
    # No healthcheck: the mock answers within a second and the app only calls it
    # during talk generation, long after boot. A health gate here only added a
    # way for the whole stack to fail to start.

  # Migrations only need DATABASE_URL (already explicit in the base compose), but
  # without this the container still inherits the developer's .env - and with it a
  # real provider key that Tier 1 has no business carrying.
  migration:
    # !override replaces the base compose's env_file entry: compose appends
    # env_file lists across files, so a plain override would still read the
    # developer's .env, real provider keys included.
    env_file: !override
      - ../tests/tier1.env

  app:
    env_file: !override
      - ../tests/tier1.env
    environment:
      # The suite authenticates against the app's internal guard, so this value
      # must stay identical to the one in the tests service below. It is written
      # out rather than interpolated from the shell: an environment variable on
      # the developer's machine must not be able to change a Tier 1 outcome.
      INTERNAL_SERVICE_SECRET: tier1-internal-secret
      LLM_BASE_URL: http://mocks:4010
      LLM_API_KEY: mock-key
      LLM_MODEL: mock-model
      REDDIT_FETCHER_URL: http://fetcher-mock:4011
      VOICE_SERVICE_URL: http://voice-mock:4012
    depends_on:
      mocks:
        condition: service_started
      fetcher-mock:
        condition: service_started
      voice-mock:
        condition: service_started
  # All SQL runs from inside the suite via the single psql_run helper
  # (docker-test.sh) — the seed service below was removed when the suite
  # gained psql access (one pattern, not two).
  tests:
    build:
      context: ../tests
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh"]
    command: ["/scripts/docker-test.sh"]
    env_file: !override
      - ../tests/tier1.env
    environment:
      - INTERNAL_SERVICE_SECRET=tier1-internal-secret
      # tier1.env holds dummy values only, so there is nothing here to blank out.
      - TARGET_URL=http://app:3000
      - STORAGE_ENDPOINT=http://seaweedfs:9000
      - TEST_SUITE=${TEST_SUITE:-all}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../tests/docker-test.sh:/scripts/docker-test.sh
      - ../tests/lib:/scripts/lib
      - ../tests/suites:/scripts/suites
      - ../tests/fixtures:/scripts/fixtures
    networks:
      - external_test_net
      - default
    depends_on:
      app:
        condition: service_healthy

networks:
  external_test_net:
    driver: bridge
