services:
  seed:
    image: postgres:17-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        psql -h db -U postgres -d socialradio -f /scripts/seed-test-user.sql
    volumes:
      - ../tests/seed-test-user.sql:/scripts/seed-test-user.sql

  tests:
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh"]
    command: ["/scripts/docker-test.sh"]
    env_file: ../../.env
    environment:
      - TARGET_URL=http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../tests/docker-test.sh:/scripts/docker-test.sh
    networks:
      - external_test_net
    depends_on:
      seed:
        condition: service_completed_successfully

networks:
  external_test_net:
    driver: bridge
